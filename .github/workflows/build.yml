name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    # SignPath 的凭据放在作业级 env，供步骤的 if 判断「是否已配置」。
    # 未配置 Secrets 时签名步骤整体跳过，普通构建照常产物。
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 第三方依赖全部随仓库提供，无需 LFS。
          lfs: false

      # 单文件 exe 的关键：静态 CRT（/MT）+ 仓库内静态 GLFW/ImGui/Bullet。
      # 不写死生成器：runner 镜像升级后 VS 版本会变，交给 CMake 自动选择已安装的那套。
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DPMX_STATIC_RUNTIME=ON
          -DPMX_BUILD_TESTS=ON
          -DPMX_ENABLE_PHYSICS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run core tests
        run: build\Release\pmx_tests.exe

      # 确认没有 VCRUNTIME/MSVCP/GLFW/Bullet 等非系统 DLL 依赖，否则不是单文件分发。
      - name: Verify self-contained exe
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found" }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }

          $exe = "pmxstudio.exe"
          if (-not (Test-Path $exe)) { throw "executable not produced" }
          $imports = & $dumpbin.FullName /DEPENDENTS $exe
          $imports | Write-Output

          $bad = $imports | Select-String -Pattern 'VCRUNTIME|MSVCP|ucrtbase|api-ms-win|glfw3\.dll|bullet'
          if ($bad) { throw "found non-system DLL dependencies: $($bad -join '; ')" }

      - name: Package single-file exe
        shell: pwsh
        run: |
          $src = "pmxstudio.exe"
          $dir = "dist\release"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $src (Join-Path $dir "PmxStudio.exe")

          $dst = Join-Path $dir "PmxStudio.exe"
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$hash  PmxStudio.exe" | Set-Content "$dst.sha256" -Encoding ascii

          $cmake = (cmake --version | Select-Object -First 1)
          $gen = (Select-String -Path "build\CMakeCache.txt" -Pattern '^CMAKE_GENERATOR:INTERNAL=' |
            Select-Object -First 1).Line -replace '^CMAKE_GENERATOR:INTERNAL=', ''
          @(
            "product=PmxStudio"
            "engine=cpp"
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "built_at=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "cmake=$cmake"
            "generator=$gen (Release, /MT)"
            "deps=GLFW 3.4, Dear ImGui v1.92.9b, Bullet 3.25"
            "size=$((Get-Item $dst).Length)"
          ) | Set-Content (Join-Path $dir "BUILD_INFO.txt") -Encoding utf8
          Get-Content (Join-Path $dir "BUILD_INFO.txt")

      # ---- SignPath 代码签名：仅标签构建且配置了 Secrets 时启用 ----
      # 需要的仓库 Secrets：
      #   SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG
      #   SIGNPATH_SIGNING_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
      # Artifact configuration 需在 SignPath 后台配置成「ZIP 内的 PmxStudio.exe」。
      - name: Upload unsigned exe
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: PmxStudio-unsigned
          path: dist/release/PmxStudio.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign exe with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      # 签名后 exe 字节变化，sha256 必须重算；BUILD_INFO 标注签名与新的体积。
      - name: Replace with signed exe
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Recurse "dist\signed" -Filter "PmxStudio.exe" |
            Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return PmxStudio.exe" }
          Copy-Item $signed.FullName "dist\release\PmxStudio.exe" -Force

          $dst = "dist\release\PmxStudio.exe"
          $sig = Get-AuthenticodeSignature $dst
          if ($sig.Status -ne "Valid") { throw "signature invalid: $($sig.Status)" }
          Write-Output "signer: $($sig.SignerCertificate.Subject)"

          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$hash  PmxStudio.exe" | Set-Content "$dst.sha256" -Encoding ascii

          $info = "dist\release\BUILD_INFO.txt"
          $lines = Get-Content $info | ForEach-Object {
            if ($_ -like "size=*") { "size=$((Get-Item $dst).Length)" } else { $_ }
          }
          $lines += "signed=SignPath.io (SignPath Foundation)"
          $lines | Set-Content $info -Encoding utf8
          Get-Content $info

      - uses: actions/upload-artifact@v4
        with:
          name: PmxStudio-windows-x64
          path: |
            dist/release/PmxStudio.exe
            dist/release/PmxStudio.exe.sha256
            dist/release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PmxStudio-windows-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "PmxStudio $tag" --generate-notes --verify-tag
          fi
          gh release upload "$tag" \
            release/PmxStudio.exe \
            release/PmxStudio.exe.sha256 \
            release/BUILD_INFO.txt \
            --clobber
